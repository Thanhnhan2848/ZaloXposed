plugins {
    alias(libs.plugins.android.application)
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('local.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def signingStoreFile = keystoreProperties['signing.storeFile']
def hasSigning = signingStoreFile != null && !signingStoreFile.toString().isEmpty()

def getGitCommitCount = { ->
    def propertyValue = project.findProperty("versionCode")
    if (propertyValue != null) {
        return propertyValue.toString().toInteger()
    }

    return providers.exec {
        commandLine 'git', 'rev-list', '--count', 'HEAD'
    }.standardOutput.asText.get().trim().toInteger()
}

android {
    namespace 'io.github.electroheavenvn.zaloxposed'
    compileSdk {
        version = release(37) {
            minorApiLevel = 2
        }
    }

    defaultConfig {
        applicationId "io.github.electroheavenvn.zaloxposed"
        minSdk 26
        targetSdk 37
        versionCode getGitCommitCount()
        versionName project.findProperty("versionName") ?: "dev"
        buildConfigField "int", "MODULE_VERSION_CODE", "${getGitCommitCount()}"
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (hasSigning) {
                storeFile = file(signingStoreFile)
                storePassword = keystoreProperties['signing.storePassword']
                keyAlias = keystoreProperties['signing.keyAlias']
                keyPassword = keystoreProperties['signing.keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

// The module is pure Java: only libdexkit.so (shipped by the dexkit dependency)
// is needed. No ZaloXposedNative library is downloaded or bundled.

dependencies {
    implementation libs.dexkit
    implementation libs.smali.dexlib2
    compileOnly("io.github.libxposed:api:102.0.0")
}