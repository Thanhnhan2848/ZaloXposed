name: Build and publish nightly APK

on:
  push:
    branches:
      - 'dev'
      - 'main'
    tags-ignore:
      - '**'
    paths:
      - 'app/**'
      - 'ZaloXposedNative/**'
      - 'gradle/**'
      - 'build.gradle'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - '.github/workflows/build-nightly.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  build-nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION_CODE=$(git rev-list --count HEAD)

          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$SIGNING_STORE_PASSWORD" ] && [ -n "$SIGNING_KEY_ALIAS" ] && [ -n "$SIGNING_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            printf 'signing.storeFile=%s\nsigning.storePassword=%s\nsigning.keyAlias=%s\nsigning.keyPassword=%s\n' \
              "$KEYSTORE_PATH" "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" > local.properties

            ./gradlew --no-daemon --stacktrace assembleRelease \
              -PversionCode="$VERSION_CODE" \
              -PversionName="nightly-${SHORT_SHA}"
          else
            echo "No signing secrets found, building Debug APK instead..."
            ./gradlew --no-daemon --stacktrace assembleDebug \
              -PversionCode="$VERSION_CODE" \
              -PversionName="nightly-${SHORT_SHA}"
          fi

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p release
          mapfile -t apks < <(find app/build/outputs/apk -type f -name '*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "APK not found" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            cp "$apk" "release/ZaloXposed-${apk##*/}"
          done

      - name: Recreate nightly tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin --delete nightly 2>/dev/null || true
          git tag -d nightly 2>/dev/null || true
          git tag nightly "$GITHUB_SHA"
          git push origin refs/tags/nightly

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly build
          prerelease: true
          generate_release_notes: false
          files: release/*.apk
